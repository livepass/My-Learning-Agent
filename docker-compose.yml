services:
  my-learning-agent:
    build: .
    ports:
      - "3000:3000"
    environment:
      INNO_CONFIG_DIR: /etc/my-learning-agent
      INNO_DATA_DIR: /var/lib/my-learning-agent/data
      INNO_WORKSPACE_DIR: /srv/my-learning-workspace
      INNO_PORT: 3000
    volumes:
      - ./runtime/config:/etc/my-learning-agent
      - ./runtime/data:/var/lib/my-learning-agent/data
      - ./workspace:/srv/my-learning-workspace
