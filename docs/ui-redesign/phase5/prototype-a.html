<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>E4.9i-P1 · 学习档案原型 · 方案 A 概览优先</title>
<style>
  /* ── Tokens: mirror of themes.css ───────────────────────────────────── */
  :root[data-theme="light"] {
    --bg: #ffffff; --surface: #ffffff; --surface-muted: #f1f4f9; --surface-raised: #fbfcfe;
    --sidebar: #f8fafd; --border: #e5e9f0; --border-strong: #d5dae2;
    --text: #1f1f1f; --muted: #444746; --subtle: #5f6368;
    --accent: #0b57d0; --accent-soft: #e8f0fe;
    --success: #137333; --warning: #b06000; --danger: #c5221f;
    --primary-bg: #1f1f1f; --primary-fg: #ffffff; --primary-bg-hover: #000000;
    --chip-bg: #f1f4f9; --shadow-soft: 0 1px 2px rgba(60,64,67,.06), 0 8px 24px rgba(60,64,67,.08);
    --scrim: rgba(17,24,39,.32);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #171717; --surface: #262626; --surface-muted: #323232; --surface-raised: #2e2e2e;
    --sidebar: #202020; --border: #3b3b3b; --border-strong: #555555;
    --text: #ececec; --muted: #c5c5c5; --subtle: #979797;
    --accent: #aecbfa; --accent-soft: #2d333c;
    --success: #8bd3a0; --warning: #f7bd55; --danger: #f39a92;
    --primary-bg: #ececec; --primary-fg: #171717; --primary-bg-hover: #ffffff;
    --chip-bg: #323232; --shadow-soft: 0 1px 2px rgba(0,0,0,.28), 0 8px 24px rgba(0,0,0,.24);
    --scrim: rgba(0,0,0,.5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.65 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, h4, p { margin: 0; }

  /* ── Prototype chrome (not part of the product) ─────────────────────── */
  .proto-bar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    background: var(--surface-raised); font-size: 12px;
  }
  .proto-bar strong { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--warning); }
  .proto-bar label { display: inline-flex; align-items: center; gap: 5px; color: var(--subtle); }
  .proto-bar select, .proto-bar button {
    padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: 7px;
    background: var(--surface); font-size: 12px;
  }
  .proto-bar .spacer { flex: 1; }
  .proto-note {
    max-width: 1120px; margin: 12px auto 0; padding: 8px 12px;
    border: 1px dashed var(--warning); border-radius: 8px;
    background: color-mix(in srgb, var(--warning) 8%, transparent);
    color: var(--muted); font-size: 12px;
  }
  body[data-chrome="clean"] .proto-bar, body[data-chrome="clean"] .proto-note { display: none; }

  /* ── Device frame (viewport simulation) ─────────────────────────────── */
  .viewport {
    container-type: inline-size;
    max-width: 100%; margin: 0 auto;
    background: var(--bg);
    display: flex; flex-direction: column; min-height: calc(100vh - 46px);
  }
  .viewport.vp-390 { max-width: 390px; border-inline: 1px solid var(--border); min-height: calc(100vh - 46px); }
  .viewport.vp-320 { max-width: 320px; border-inline: 1px solid var(--border); min-height: calc(100vh - 46px); }

  /* ── App chrome ─────────────────────────────────────────────────────── */
  .appbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--sidebar);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-size: 13px;
  }
  .appbar .spacer { flex: 1; }
  .ghost-btn {
    padding: 5px 10px; border: 1px solid var(--border-strong); border-radius: 8px;
    background: var(--surface); font-size: 12px;
  }
  .bottom-nav { display: none; }

  main { padding: 16px 24px 40px; flex: 1; }
  .page { max-width: 1120px; margin: 0 auto; display: grid; gap: 16px; }

  /* ── Page head ──────────────────────────────────────────────────────── */
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .page-head h1 { font-size: 24px; font-weight: 600; letter-spacing: -.3px; line-height: 1.3; }
  .page-head p { margin-top: 6px; color: var(--subtle); font-size: 13px; max-width: 62ch; }
  .scope { display: flex; align-items: center; gap: 8px; }
  .scope label { font-size: 12px; color: var(--subtle); }
  .scope select {
    min-width: 150px; padding: 7px 10px; border: 1px solid var(--border-strong);
    border-radius: 8px; background: var(--surface);
  }

  /* ── Cards ──────────────────────────────────────────────────────────── */
  .card {
    display: grid; gap: 16px; padding: 20px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
  }
  .card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card-head h2 { font-size: 15px; font-weight: 600; }
  .card-head .spacer { flex: 1; }
  .card-head .hint { font-size: 12px; color: var(--subtle); }
  .count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 20px; padding: 0 6px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600;
  }

  /* ── Buttons ────────────────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: 8px;
    background: var(--surface); font-size: 12px; line-height: 1.4; min-height: 30px;
  }
  .btn:hover { background: var(--surface-muted); }
  .btn.primary { background: var(--primary-bg); color: var(--primary-fg); border-color: var(--primary-bg); }
  .btn.primary:hover { background: var(--primary-bg-hover); }
  .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
  .btn.xs { padding: 3px 9px; min-height: 26px; font-size: 11.5px; }
  .btn:focus-visible, .krow-main:focus-visible, .acc-head:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }

  /* ── Badges ─────────────────────────────────────────────────────────── */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500;
    background: var(--surface-muted); color: var(--subtle); white-space: nowrap;
  }
  .badge.success { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); }
  .badge.warning { background: color-mix(in srgb, var(--warning) 14%, transparent); color: var(--warning); }
  .badge.danger  { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .badge.accent  { background: var(--accent-soft); color: var(--accent); }
  .badge.plain   { background: transparent; border: 1px solid var(--border); color: var(--subtle); }

  /* ── Overview (方案 A 的核心) ───────────────────────────────────────── */
  .conclusion { display: grid; gap: 6px; }
  .conclusion .lead { font-size: 17px; font-weight: 600; line-height: 1.5; letter-spacing: -.1px; }
  .conclusion .sub { font-size: 13px; color: var(--muted); }
  .conclusion .src { font-size: 11.5px; color: var(--subtle); }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .stat { display: grid; gap: 2px; padding: 12px 14px; border-radius: 8px; background: var(--surface-muted); }
  .stat .k { font-size: 12px; color: var(--subtle); }
  .stat .v { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .stat .n { font-size: 11px; color: var(--subtle); }
  .stat.alert .v { color: var(--warning); }
  .stat.danger .v { color: var(--danger); }

  /* ── Summary block ──────────────────────────────────────────────────── */
  .summary-read {
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-muted); font-size: 13px; line-height: 1.7; color: var(--muted);
    white-space: pre-wrap;
  }
  .summary-empty {
    padding: 12px 14px; border: 1px dashed var(--border); border-radius: 8px;
    font-size: 13px; color: var(--subtle);
  }
  .editor { display: grid; gap: 10px; }
  .editor textarea {
    width: 100%; min-height: 96px; padding: 10px 12px; resize: vertical;
    border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface);
    font-size: 13px; line-height: 1.7;
  }
  .editor .row { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .field-error {
    padding: 8px 10px; border-radius: 8px; font-size: 12px;
    background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger);
  }
  .note-inline { font-size: 12px; color: var(--subtle); }

  /* ── Knowledge rows ─────────────────────────────────────────────────── */
  .klist { display: grid; }
  .krow { border-top: 1px solid var(--border); }
  .krow:first-child { border-top: 0; }
  .krow-main {
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    align-items: center; gap: 12px; width: 100%;
    padding: 14px 2px; border: 0; background: transparent; text-align: left;
  }
  .kname { display: grid; gap: 2px; min-width: 0; }
  .kname strong { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .kname .sub { font-size: 11.5px; color: var(--subtle); overflow-wrap: anywhere; }
  .kmeta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .kmeta .muted { font-size: 11.5px; color: var(--subtle); white-space: nowrap; }
  .kmeta .chev { color: var(--subtle); transition: transform .15s ease; }
  .krow-main[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .kdetail {
    display: grid; gap: 12px; margin: 0 0 14px; padding: 14px;
    border-radius: 8px; background: var(--surface-muted);
  }
  .kdetail .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .kdetail h4 { font-size: 11.5px; font-weight: 600; letter-spacing: .03em; color: var(--subtle); text-transform: uppercase; }
  .kdetail p { font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
  .kdetail ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; }
  .mastery-line { display: flex; align-items: center; gap: 10px; }
  .bar { flex: 1; height: 6px; border-radius: 999px; background: var(--chip-bg); overflow: hidden; min-width: 60px; }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
  .mastery-line .pct { font-size: 12px; color: var(--muted); min-width: 42px; text-align: right; }
  .caveat {
    padding: 8px 10px; border-left: 2px solid var(--border-strong);
    font-size: 11.5px; color: var(--subtle); line-height: 1.65;
  }

  /* ── Weak list ──────────────────────────────────────────────────────── */
  .weak-item {
    display: grid; gap: 6px; padding: 12px 0; border-top: 1px solid var(--border);
  }
  .weak-item:first-child { border-top: 0; padding-top: 0; }
  .weak-item .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .weak-item .head strong { font-size: 13.5px; overflow-wrap: anywhere; }
  .weak-item p { font-size: 12.5px; color: var(--muted); }
  .weak-item .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ── Goal rows ──────────────────────────────────────────────────────── */
  .goal {
    display: flex; align-items: flex-start; gap: 12px; padding: 12px 0;
    border-top: 1px solid var(--border);
  }
  .goal:first-child { border-top: 0; padding-top: 0; }
  .goal .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 8px; flex: none; background: var(--accent); }
  .goal .body { flex: 1; min-width: 0; display: grid; gap: 4px; }
  .goal .title { font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
  .goal .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--subtle); }
  .goal .side { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .goal ul { margin: 4px 0 0; padding-left: 18px; font-size: 12px; color: var(--muted); }

  /* ── Misconceptions ─────────────────────────────────────────────────── */
  .misc {
    display: grid; gap: 10px; padding: 14px; border-radius: 8px;
    border: 1px solid color-mix(in srgb, var(--danger) 28%, transparent);
    background: color-mix(in srgb, var(--danger) 7%, transparent);
  }
  .misc + .misc { margin-top: 10px; }
  .misc .head { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
  .misc .head strong { font-size: 13.5px; color: var(--danger); flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .misc .meta { font-size: 11.5px; color: var(--subtle); }
  .misc .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .misc label { display: grid; gap: 4px; min-width: 0; font-size: 11.5px; color: var(--subtle); }
  .misc .grid2 > * { min-width: 0; }
  .misc select, .misc textarea, .misc input[type=range] { width: 100%; min-width: 0; max-width: 100%; margin: 0; }
  .misc select, .misc textarea {
    padding: 6px 8px; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface);
    font-size: 12.5px;
  }

  /* ── Preferences ────────────────────────────────────────────────────── */
  .prefs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .pref { display: grid; gap: 6px; }
  .pref .label { font-size: 12px; font-weight: 600; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
    font-size: 12px;
  }
  .chip button { border: 0; background: transparent; color: inherit; padding: 0; font-size: 13px; line-height: 1; }
  .chip-input {
    min-width: 120px; flex: 1; padding: 4px 8px; border: 1px solid var(--border);
    border-radius: 999px; background: var(--surface); font-size: 12px;
  }

  /* ── Unavailable / empty / error ────────────────────────────────────── */
  .unavailable {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 14px; border: 1px dashed var(--border-strong); border-radius: 8px;
    font-size: 12.5px; color: var(--subtle); line-height: 1.7;
  }
  .empty { padding: 18px 4px; text-align: center; font-size: 13px; color: var(--subtle); }
  .error-card {
    display: grid; gap: 12px; padding: 18px; border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
    background: color-mix(in srgb, var(--danger) 8%, transparent);
  }
  .error-card h2 { font-size: 15px; color: var(--danger); }
  .error-card p { font-size: 13px; color: var(--muted); }
  .loading { display: flex; align-items: center; gap: 8px; padding: 24px 0; color: var(--subtle); font-size: 13px; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border-strong); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Course summary ─────────────────────────────────────────────────── */
  .course-facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .fact { display: grid; gap: 2px; padding: 12px 14px; border-radius: 8px; background: var(--surface-muted); }
  .fact strong { font-size: 19px; font-weight: 600; }
  .fact span { font-size: 11.5px; color: var(--subtle); }
  .divider-note { font-size: 11.5px; color: var(--subtle); line-height: 1.65; }

  /* ── Toast ──────────────────────────────────────────────────────────── */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    padding: 8px 14px; border-radius: 8px; background: var(--primary-bg); color: var(--primary-fg);
    font-size: 12.5px; box-shadow: var(--shadow-soft); z-index: 80;
  }

  /* ── Container queries: the device frame and real narrow windows ────── */
  @container (max-width: 900px) {
    main { padding: 12px 12px 88px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .course-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .prefs { grid-template-columns: minmax(0, 1fr); }
    .bottom-nav {
      position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border); background: var(--sidebar);
    }
    .bottom-nav span {
      display: grid; place-items: center; gap: 2px; padding: 8px 0 10px;
      font-size: 11px; color: var(--subtle);
    }
    .bottom-nav span.active { color: var(--accent); font-weight: 600; }
  }
  @container (max-width: 640px) {
    .page-head { gap: 12px; }
    .page-head h1 { font-size: 21px; }
    .page-head p { font-size: 12.5px; }
    .scope { width: 100%; }
    .scope select { flex: 1; min-width: 0; }
    .card { padding: 14px; gap: 14px; }
    .conclusion .lead { font-size: 15.5px; }
    .krow-main { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 12px 0; }
    .kmeta { justify-content: flex-start; }
    .kdetail .grid2 { grid-template-columns: minmax(0, 1fr); }
    .misc .grid2 { grid-template-columns: minmax(0, 1fr); }
    .goal { flex-wrap: wrap; }
    .goal .side { width: 100%; justify-content: flex-start; padding-left: 20px; }
    .stat .v { font-size: 19px; }
  }
  @container (max-width: 380px) {
    main { padding: 10px 8px 84px; }
    .card { padding: 12px; }
    .kmeta .muted.hide-xs { display: none; }
    .stats { gap: 8px; }
    .stat { padding: 10px; }
  }
</style>
</head>
<body data-chrome="bar">
<div class="proto-bar">
  <strong>原型 · 方案 A</strong>
  <label>场景
    <select id="scenario">
      <option value="all-records">全部课程 · 有学习记录</option>
      <option value="course-records">指定课程 · 有学习记录</option>
      <option value="no-evidence">暂无知识证据</option>
      <option value="review-due">存在待复习知识点</option>
      <option value="misconception">存在活跃误区</option>
      <option value="detail-open">知识点详情展开</option>
      <option value="editing">编辑学习摘要</option>
      <option value="error">数据读取失败</option>
      <option value="long-name">长知识点名称</option>
      <option value="mobile">移动端布局（390）</option>
    </select>
  </label>
  <label>主题
    <select id="theme">
      <option value="light">浅色</option>
      <option value="dark">深色</option>
    </select>
  </label>
  <label>视口
    <select id="viewport">
      <option value="desktop">桌面</option>
      <option value="390">390 × 844</option>
      <option value="320">320 × 640</option>
    </select>
  </label>
  <label><input type="checkbox" id="savefail" /> 模拟保存失败</label>
  <span class="spacer"></span>
  <button id="reset">重置交互</button>
</div>

<div class="proto-note">
  方案 A「概览优先」：先给结论与计数，再列知识状态，最后是目标 / 误区 / 偏好。状态文案统一取服务端 <code>state_label</code>；<code>mastery</code> 只作辅助数值。
  所有交互均为本地演示，不会写入真实档案。
</div>

<div class="viewport" id="viewport">
  <header class="appbar">
    <div class="brand"><span class="brand-mark">▣</span> My Learning Agent</div>
    <span class="spacer"></span>
    <button class="ghost-btn">设置</button>
  </header>
  <main><div class="page" id="app"></div></main>
  <nav class="bottom-nav" aria-label="主导航（移动端）">
    <span>⌂<br/>今日</span><span>▤<br/>学习</span><span>✎<br/>练习</span><span class="active">◎<br/>档案</span>
  </nav>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Fixtures — shapes mirror GET /api/learner/profile and GET /api/courses/:id/learner
// ─────────────────────────────────────────────────────────────────────────────
const STATE_LABEL = {
  unknown: "证据不足", learning: "学习中", fragile: "不稳定",
  review_due: "待复习", stable: "稳定", misconception: "存在误区",
};
const STATE_TONE = {
  unknown: "plain", learning: "accent", fragile: "warning",
  review_due: "warning", stable: "success", misconception: "danger",
};
const STATE_WHY = {
  unknown: "没有足够可靠的学习证据，状态未知。",
  learning: "已有接触或低质量证据，尚不能确认独立掌握。",
  fragile: "近期有成功表现，但稳定度或证据质量仍不足。",

const S = {

  editingConcept: null, conceptDraft: null, saveFail: false, toast: null,
  editingGoal: null, goalDraft: null, editingMisc: null,
};
const params = new URLSearchParams(location.search);
if (params.get("scenario")) S.scenario = params.get("scenario");
if (params.get("theme")) S.theme = params.get("theme");
if (params.get("viewport")) S.viewport = params.get("viewport");
if (params.get("ui") === "clean") document.body.dataset.chrome = "clean";

function loadScenario(name) {
  S.scenario = name;
  S.data = fixture(name);
  S.expanded = name === "detail-open" ? S.data.concepts[0]?.concept_id ?? null : null;
  S.editingSummary = name === "editing";
  S.summaryDraft = S.editingSummary ? (S.data.summary || "") : "";
  S.summaryDirty = false;
  S.editingConcept = null; S.conceptDraft = null;
  S.editingGoal = null; S.editingMisc = null;
  S.toast = null;
  if (name === "mobile") S.viewport = "390";
  document.documentElement.dataset.theme = S.theme;
  applyViewport();
  syncControls();
  render();
}

function applyViewport() {
  const vp = document.getElementById("viewport");
  vp.className = "viewport" + (S.viewport === "desktop" ? "" : ` vp-${S.viewport}`);
}
function syncControls() {
  document.getElementById("scenario").value = S.scenario;
  document.getElementById("theme").value = S.theme;
  document.getElementById("viewport").value = S.viewport;
  document.getElementById("savefail").checked = S.saveFail;
}
function toast(message) {
  S.toast = message;
  render();
  setTimeout(() => { if (S.toast === message) { S.toast = null; render(); } }, 2200);
}
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shortDate = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  return `${d.getMonth() + 1}月${d.getDate()}日`;
};

// ─────────────────────────────────────────────────────────────────────────────
// Derived display helpers — every conclusion below is computed from the data
// shown on the page, never invented.
// ─────────────────────────────────────────────────────────────────────────────
const isWeak = (c) => ["fragile", "learning", "misconception", "review_due"].includes(c.state_label);
function counts(d) {
  const c = d.concepts;
  return {
    total: c.length,
    due: c.filter((x) => x.state_label === "review_due").length,
    misc: c.filter((x) => x.state_label === "misconception").length,
    weak: c.filter(isWeak).length,
    stable: c.filter((x) => x.state_label === "stable").length,
    evidenced: c.filter((x) => x.evidence_ids.length > 0).length,
  };
}
function conclusionText(d) {
  const n = counts(d);
  if (n.total === 0) {
    return { lead: "还没有形成可复习的知识点。", sub: "完成一次练习或学习对话后，这里会出现基于证据的知识状态。", src: "" };
  }
  const lead = `共记录 ${n.total} 个知识点，其中 ${n.weak} 个需要关注${n.stable ? `，${n.stable} 个状态稳定` : ""}。`;
  const acts = [];
  if (n.misc) acts.push(`先修复 ${n.misc} 个活跃误区`);
  if (n.due) acts.push(`再做 ${n.due} 个到期复习`);
  const sub = acts.length ? `${acts.join("，")}。` : "当前没有到期复习或活跃误区，可以继续推进计划任务。";
  return { lead, sub, src: "以上结论由当前知识状态计数得出，不含模型推测。" };
}

function render() {
  const app = document.getElementById("app");
  const d = S.data;
  app.innerHTML = d.error ? renderError(d.error) : renderPage(d);
  if (S.toast) app.insertAdjacentHTML("beforeend", `<div class="toast" role="status">${esc(S.toast)}</div>`);
}

function renderError(message) {
  return `
    <div class="page-head">
      <div><h1>我的学习档案</h1><p>学习目标、知识掌握、薄弱点与教学偏好都来自同一份本机档案。</p></div>
      ${scopeSelect()}
    </div>
    <div class="error-card" role="alert">
      <h2>读取学习档案失败</h2>
      <p>${esc(message)}</p>
      <p class="divider-note">课程范围选择仍然可用；切换范围会重新发起读取。下面的数据没有做任何本地缓存填充，以免把旧数据当成当前档案。</p>
      <div><button class="btn primary" data-act="retry">重新读取</button></div>
    </div>`;
}

function scopeSelect() {
  const course = S.data.course;
  return `
    <div class="scope">
      <label for="scope">范围</label>
      <select id="scope" data-act="scope">
        <option value="all" ${S.data.scope === "all" ? "selected" : ""}>全部课程</option>
        <option value="course" ${S.data.scope === "course" ? "selected" : ""}>${esc(course ? course.title : "同义替换")}</option>
      </select>
    </div>`;
}

function renderPage(d) {
  const head = `
    <div class="page-head">
      <div>
        <h1>我的学习档案</h1>
        <p>${d.scope === "course"
          ? "只显示归属这门课程的学习记录；误区与画像摘要属于全部课程档案。"
          : "学习目标、知识状态、误区与教学偏好来自同一份本机档案。"}</p>
      </div>
      ${scopeSelect()}
    </div>`;
  if (d.scope === "course") return head + renderCourse(d);
  return head + `
    ${renderOverview(d)}
    ${renderKnowledge(d)}
    ${renderWeak(d)}
    ${renderGoals(d)}
    ${renderMisconceptions(d)}
    ${renderPreferences(d, true)}`;
}

// ── Overview ────────────────────────────────────────────────────────────────

      <div class="stat ${d.misconceptions.some((m) => m.status === "active") ? "danger" : ""}"><div class="k">未解决误区</div><div class="v">${d.misconceptions.filter((m) => m.status === "active" || m.status === "repairing").length}</div><div class="n">存在或修复中</div></div>

// ── Knowledge ───────────────────────────────────────────────────────────────
function renderKnowledge(d) {
  const n = counts(d);
  if (n.total === 0) {
    return `
      <section class="card" aria-labelledby="kn-title">
        <div class="card-head"><h2 id="kn-title">知识掌握情况</h2><span class="spacer"></span><span class="count">0</span></div>

function renderKnowledgeRow(c, d) {
  const open = S.expanded === c.concept_id;

          <div class="mastery-line">
            <input type="range" min="0" max="100" value="${Math.round(draft.mastery * 100)}" data-act="draft-mastery" style="flex:1" />
            <span class="pct">${Math.round(draft.mastery * 100)}%</span>
          </div>
        </div>
        <div>
          <h4>诊断</h4>
          <textarea data-act="draft-diagnosis" aria-label="诊断" style="width:100%;min-height:64px;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface)">${esc(draft.diagnosis)}</textarea>
        </div>
        <div>
          <h4>下一步动作（每行一条）</h4>
          <textarea data-act="draft-next" aria-label="下一步动作" style="width:100%;min-height:64px;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface)">${esc(draft.next_actions.join("\n"))}</textarea>
        </div>
        ${S.saveFail ? `<div class="field-error" role="alert">保存失败：服务暂时不可用。输入仍然保留。</div>` : ""}
        <div class="row" style="display:flex;justify-content:flex-end;gap:8px">
          <button class="btn" data-act="concept-cancel">取消</button>
          <button class="btn primary" data-act="concept-save" data-id="${esc(c.concept_id)}">保存</button>
        </div>
        <p class="note-inline">保存后该知识点会被标记为「人工维护」，不再随新证据自动重算。这是服务端的既有行为。</p>
      </div>`;
  }
  return `
    <div class="kdetail">
      <div class="grid2">
        <div>
          <h4>掌握度参考</h4>
          <div class="mastery-line">
            <span class="bar"><i style="width:${pct}%"></i></span>
            <span class="pct">${pct}%</span>
          </div>
          <p class="caveat">启发式分值，仅用于相对排序，不代表正确率。</p>
        </div>
        <div>
          <h4>来源与复习</h4>
          <p style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <span class="badge ${provTone}">${esc(provenance)}</span>
            <span class="badge plain">${esc(c.review_due_at ? `复习 ${shortDate(c.review_due_at)}` : "未安排复习")}</span>
            <span class="badge plain">证据标识 ${c.evidence_ids.length} 个</span>
          </p>
          <p class="caveat">${c.origin === "manual"
            ? "这个知识点已由人工编辑，数值不再随证据重算。"
            : c.provenance_unknown
              ? "这条记录的来源无法追溯，数值只作为旧数据保留。"
              : "由证据账本推导；同一事件的旧版镜像会重复计入证据标识。"}</p>
        </div>
      </div>
      <div>
        <h4>诊断</h4>
        <p>${esc(c.diagnosis || "暂无诊断。")}</p>
      </div>
      <div>
        <h4>下一步</h4>
        ${c.next_actions.length
          ? `<ul>${c.next_actions.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>`
          : `<p class="note-inline">暂无建议。</p>`}
      </div>
      <div class="caveat">本阶段没有证据明细接口，无法列出每条证据的时间、题型与得分；这里只显示证据标识数量。</div>
      <div style="display:flex;justify-content:flex-end">
        <button class="btn xs" data-act="concept-edit" data-id="${esc(c.concept_id)}">编辑诊断与下一步</button>
      </div>
    </div>`;
}

// ── Weak + next actions ─────────────────────────────────────────────────────
function renderWeak(d) {
  const weak = d.concepts.filter(isWeak);
  if (weak.length === 0) {
    return `
      <section class="card">
        <div class="card-head"><h2>薄弱知识与复习</h2><span class="spacer"></span><span class="hint">当前没有需要关注的知识点</span></div>
        <p class="empty">没有不稳定、学习中、待复习或存在误区的知识点。</p>
      </section>`;
  }
  const items = weak.map((c) => `
    <div class="weak-item">
      <div class="head">
        <strong>${esc(c.concept_name || "知识点名称待确认")}</strong>
        <span class="badge ${STATE_TONE[c.state_label]}">${STATE_LABEL[c.state_label]}</span>
        <span class="badge plain">${c.review_due_at ? `复习 ${shortDate(c.review_due_at)}` : "未安排复习"}</span>
      </div>
      <p>${esc(c.next_actions[0] || c.diagnosis || "暂无建议。")}</p>
      <div class="actions">
        <button class="btn xs primary" data-act="practice" data-id="${esc(c.concept_id)}">去练习</button>
        <button class="btn xs" data-act="toggle" data-id="${esc(c.concept_id)}">查看详情</button>
      </div>
    </div>`).join("");
  return `
    <section class="card">
      <div class="card-head"><h2>薄弱知识与复习</h2><span class="count">${weak.length}</span><span class="spacer"></span><span class="hint">下一步行动来自服务端知识状态</span></div>
      ${items}
    </section>`;
}

// ── Goals ───────────────────────────────────────────────────────────────────
function priorityText(p) {
  if (typeof p !== "number" || !Number.isFinite(p)) return "优先级未知";
  if (p < 0 || p > 1) return `优先级数据异常（${p}）`;
  return `优先级 ${Math.round(p * 100)}%`;
}
function renderGoals(d) {
  const body = d.goals.length === 0
    ? `<p class="empty">暂无学习目标。点击「新增目标」添加一个。</p>`
    : d.goals.map((g) => S.editingGoal === g.goal_id ? renderGoalEditor(g) : renderGoalRow(g)).join("");
  return `
    <section class="card">
      <div class="card-head">
        <h2>学习目标</h2><span class="count">${d.goals.length}</span>
        <span class="spacer"></span>
        <button class="btn xs primary" data-act="goal-add">＋ 新增目标</button>
      </div>
      ${body}
    </section>`;
}
function renderGoalRow(g) {
  const dot = g.status === "active" ? "var(--accent)" : g.status === "paused" ? "var(--warning)" : g.status === "completed" ? "var(--success)" : "var(--subtle)";
  return `
    <div class="goal">
      <span class="dot" style="background:${dot}"></span>
      <div class="body">
        <div class="title">${esc(g.title)}</div>
        <div class="meta">
          <span class="badge plain">${esc({ skill: "技能", concept: "概念", project: "项目", exam: "考试", habit: "习惯" }[g.type] || g.type)}</span>
          <span>${esc(priorityText(g.priority))}</span>
          ${g.priority > 1 ? `<span class="badge warning" title="存储值超出 0–1 范围">数据异常</span>` : ""}
        </div>
        ${g.success_criteria.length ? `<ul>${g.success_criteria.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
      </div>
      <div class="side">
        <span class="badge ${g.status === "active" ? "accent" : g.status === "paused" ? "warning" : g.status === "completed" ? "success" : "plain"}">${esc({ active: "进行中", paused: "已暂停", completed: "已完成", archived: "已归档" }[g.status])}</span>
        <button class="btn xs" data-act="goal-edit" data-id="${esc(g.goal_id)}">编辑</button>
        <button class="btn xs danger" data-act="goal-delete" data-id="${esc(g.goal_id)}">删除</button>
      </div>
    </div>`;
}
function renderGoalEditor(g) {
  return `
    <div class="goal" style="display:grid;gap:8px">
      <input value="${esc(g.title)}" data-act="goal-draft-title" aria-label="目标标题" style="padding:6px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface)" />
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select data-act="goal-draft-status" aria-label="目标状态" style="padding:6px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface)">
          ${["active", "paused", "completed", "archived"].map((s) => `<option value="${s}" ${g.status === s ? "selected" : ""}>${{ active: "进行中", paused: "已暂停", completed: "已完成", archived: "已归档" }[s]}</option>`).join("")}
        </select>
        <span style="flex:1"></span>
        <button class="btn xs" data-act="goal-cancel">取消</button>
        <button class="btn xs primary" data-act="goal-save" data-id="${esc(g.goal_id)}">保存</button>
      </div>
    </div>`;
}

// ── Misconceptions ──────────────────────────────────────────────────────────
function renderMisconceptions(d) {
  if (d.misconceptions === null) {
    return `
      <section class="card">
        <div class="card-head"><h2>误解记录</h2><span class="spacer"></span><span class="hint">当前范围不提供</span></div>
        <div class="unavailable"><span>ⓘ</span><span>课程范围接口不返回误区数据。误区属于全部课程档案，请切换到「全部课程」查看与编辑。</span></div>
      </section>`;
  }
  const items = d.misconceptions.length === 0
    ? `<p class="empty">暂未发现误解。</p>`
    : d.misconceptions.map((m) => `
      <div class="misc">
        <div class="head">
          <strong>${esc(m.description)}</strong>
          <span class="badge ${m.status === "active" ? "danger" : m.status === "repairing" ? "warning" : "plain"}">${esc({ active: "存在", repairing: "修复中", resolved: "已解决", stale: "失效" }[m.status])}</span>
        </div>
        <div class="meta">${esc(m.concept)} · 最近 ${shortDate(m.last)}</div>
        <div class="grid2">
          <label>状态
            <select data-act="misc-status" data-id="${esc(m.id)}">
              ${["active", "repairing", "resolved", "stale"].map((s) => `<option value="${s}" ${m.status === s ? "selected" : ""}>${{ active: "存在", repairing: "修复中", resolved: "已解决", stale: "失效" }[s]}</option>`).join("")}
            </select>
          </label>
          <label>严重度 ${Math.round(m.severity * 100)}%
            <input type="range" min="0" max="100" value="${Math.round(m.severity * 100)}" data-act="misc-severity" data-id="${esc(m.id)}" />
          </label>
        </div>
        <label>修复策略
          <textarea data-act="misc-repair" data-id="${esc(m.id)}" style="min-height:52px">${esc(m.repair)}</textarea>
        </label>
        <div style="display:flex;justify-content:flex-end">
          <button class="btn xs primary" data-act="misc-save" data-id="${esc(m.id)}">保存修改</button>
        </div>
      </div>`).join("");
  return `
    <section class="card">
      <div class="card-head"><h2>误解记录</h2><span class="count">${d.misconceptions.length}</span><span class="spacer"></span><span class="hint">可修改状态、严重度与修复策略</span></div>
      ${items}
    </section>`;
}

// ── Preferences ─────────────────────────────────────────────────────────────
function renderPreferences(d, editable) {
  const p = d.prefs;
  const fields = [
    ["explanation_style", "讲解风格"], ["practice_style", "练习方式"],
    ["feedback_tone", "反馈语气"], ["avoid", "应避免"],
  ];
  const body = fields.map(([key, label]) => `
    <div class="pref">
      <div class="label">${label}</div>
      <div class="chips">
        ${(p[key] || []).length
          ? (p[key] || []).map((v) => `<span class="chip">${esc(v)}${editable ? `<button data-act="pref-remove" data-key="${key}" data-value="${esc(v)}" aria-label="移除 ${esc(v)}">×</button>` : ""}</span>`).join("")
          : `<span class="note-inline">未设置</span>`}
        ${editable ? `<input class="chip-input" placeholder="回车添加…" data-act="pref-input" data-key="${key}" />` : ""}
      </div>
    </div>`).join("");
  return `
    <section class="card">
      <div class="card-head">
        <h2>学习偏好</h2><span class="spacer"></span>
        <span class="badge plain">${editable ? "个人设置 · 对所有课程生效" : "个人共享设置 · 本范围只读"}</span>
      </div>
      <div class="prefs">${body}</div>
      ${editable ? "" : `<div class="unavailable"><span>ⓘ</span><span>教学偏好属于个人档案，对所有课程生效；课程范围只展示，不按课程修改。</span></div>`}
    </section>`;
}

// ── Course view ─────────────────────────────────────────────────────────────
function renderCourse(d) {
  const n = counts(d);
  const facts = `
    <div class="course-facts">
      <div class="fact"><strong>${d.task.completed}/${d.task.total}</strong><span>已完成任务（服务端统计）</span></div>
      <div class="fact"><strong>${d.task.percent}%</strong><span>任务完成率</span></div>
      <div class="fact"><strong>${n.evidenced}</strong><span>有证据的知识点</span></div>
      <div class="fact"><strong>${n.weak}</strong><span>需要关注的知识点</span></div>
    </div>`;
  return `
    <section class="card">
      <div class="card-head">
        <h2>${esc(d.course.title)}</h2><span class="spacer"></span>
        <span class="hint">只显示归属这门课程的学习记录</span>
      </div>
      ${facts}
      <p class="divider-note">任务完成率来自课程计划；知识状态只来自真实学习证据。两者分开显示，完成的任务不会自动被计为已掌握。</p>
    </section>
    ${renderCourseGoals(d)}
    ${renderKnowledge(d)}
    ${renderWeak(d)}
    ${renderMisconceptions(d)}
    <section class="card">
      <div class="card-head"><h2>未归类的旧记录</h2></div>
      <div class="unavailable"><span>ⓘ</span><span>另有 ${d.unclassified.concepts} 条知识点与 ${d.unclassified.goals} 个目标没有课程归属。它们不会并入本课程统计，也不会被自动删除。</span></div>
    </section>
    ${renderPreferences(d, false)}`;
}
function renderCourseGoals(d) {
  const body = d.goals.length === 0
    ? `<p class="empty">这门课程还没有关联学习目标。</p>`
    : d.goals.map((g) => `
      <div class="goal">
        <span class="dot" style="background:var(--accent)"></span>
        <div class="body">
          <div class="title">${esc(g.title)}</div>
          <div class="meta"><span class="badge accent">${esc({ active: "进行中", paused: "已暂停", completed: "已完成", archived: "已归档" }[g.status])}</span></div>
          ${g.success_criteria.length ? `<ul>${g.success_criteria.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
        </div>
      </div>`).join("");
  return `
    <section class="card">
      <div class="card-head"><h2>课程学习目标</h2><span class="count">${d.goals.length}</span><span class="spacer"></span><span class="hint">目标来自学习档案，课程只保存关联关系</span></div>
      ${body}
    </section>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Events
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById("scenario").addEventListener("change", (e) => loadScenario(e.target.value));
document.getElementById("theme").addEventListener("change", (e) => {
  S.theme = e.target.value;
  document.documentElement.dataset.theme = S.theme;
});
document.getElementById("viewport").addEventListener("change", (e) => { S.viewport = e.target.value; applyViewport(); });
document.getElementById("savefail").addEventListener("change", (e) => { S.saveFail = e.target.checked; render(); });
document.getElementById("reset").addEventListener("click", () => loadScenario(S.scenario));

document.getElementById("app").addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  const d = S.data;

  switch (act) {
    case "retry":
      toast("原型：将重新发起读取请求");
      break;
    case "toggle": {
      S.expanded = S.expanded === id ? null : id;
      S.editingConcept = null;
      render();
      if (S.expanded) {
        const row = document.querySelector(`.krow-main[data-id="${CSS.escape(S.expanded)}"]`);
        row?.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
      break;
    }
    case "summary-edit":
      S.editingSummary = true; S.summaryDraft = d.summary || ""; S.summaryDirty = false;
      render();
      document.getElementById("summary-text")?.focus();
      break;
    case "summary-cancel":
      if (S.summaryDirty && !confirm("放弃未保存的摘要修改？")) return;
      S.editingSummary = false; S.saveFail = false; render();
      break;
    case "summary-save":
      if (S.saveFail) { render(); return; }
      d.summary = S.summaryDraft;
      S.editingSummary = false; S.summaryDirty = false;
      toast("摘要已保存");
      break;
    case "concept-edit": {
      const c = d.concepts.find((x) => x.concept_id === id);
      S.editingConcept = id;
      S.conceptDraft = { mastery: c.mastery, diagnosis: c.diagnosis, next_actions: [...c.next_actions] };
      render();
      break;
    }
    case "concept-cancel":
      S.editingConcept = null; S.saveFail = false; render();
      break;
    case "concept-save": {
      if (S.saveFail) { render(); return; }
      const c = d.concepts.find((x) => x.concept_id === id);
      c.mastery = S.conceptDraft.mastery;
      c.diagnosis = S.conceptDraft.diagnosis;
      c.next_actions = S.conceptDraft.next_actions;
      c.origin = "manual";
      S.editingConcept = null;
      toast("已保存，该知识点转为「人工维护」");
      break;
    }
    case "practice":
      toast("原型：将带着该知识点进入练习页");
      break;
    case "goal-add":
      toast("原型：打开「新建学习目标」对话框");
      break;
    case "goal-edit":
      S.editingGoal = id; render(); break;
    case "goal-cancel":
      S.editingGoal = null; render(); break;
    case "goal-save": {
      const g = d.goals.find((x) => x.goal_id === id);
      const title = document.querySelector('[data-act="goal-draft-title"]')?.value?.trim();
      const status = document.querySelector('[data-act="goal-draft-status"]')?.value;
      if (g) { g.title = title || g.title; g.status = status || g.status; }
      S.editingGoal = null; toast("目标已保存"); break;
    }
    case "goal-delete": {
      d.goals = d.goals.filter((x) => x.goal_id !== id);
      toast("目标已删除"); break;
    }
    case "misc-save":
      toast("误解记录已保存"); break;
    case "pref-remove": {
      const key = el.dataset.key;
      d.prefs[key] = d.prefs[key].filter((v) => v !== el.dataset.value);
      render(); break;
    }
  }
});

document.getElementById("app").addEventListener("change", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "scope") {
    loadScenario(el.value === "course" ? "course-records" : (S.scenario === "course-records" ? "all-records" : S.scenario));
  }
  if (el.dataset.act === "misc-status" || el.dataset.act === "misc-severity") {
    const m = S.data.misconceptions?.find((x) => x.id === el.dataset.id);
    if (!m) return;
    if (el.dataset.act === "misc-status") m.status = el.value;
    else m.severity = Number(el.value) / 100;
    render();
  }
});

document.getElementById("app").addEventListener("input", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  switch (el.dataset.act) {
    case "summary-text":
      S.summaryDraft = el.value; S.summaryDirty = true; break;
    case "draft-mastery":
      S.conceptDraft.mastery = Number(el.value) / 100;
      el.parentElement.querySelector(".pct").textContent = `${el.value}%`;
      break;
    case "draft-diagnosis":
      S.conceptDraft.diagnosis = el.value; break;
    case "draft-next":
      S.conceptDraft.next_actions = el.value.split("\n").map((s) => s.trim()).filter(Boolean); break;
    case "misc-severity": {
      const m = S.data.misconceptions?.find((x) => x.id === el.dataset.id);
      if (m) m.severity = Number(el.value) / 100;
      break;
    }
    case "misc-repair": {
      const m = S.data.misconceptions?.find((x) => x.id === el.dataset.id);
      if (m) m.repair = el.value;
      break;
    }
  }
});

document.getElementById("app").addEventListener("keydown", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (e.key === "Enter" && el.dataset.act === "pref-input") {
    e.preventDefault();
    const value = el.value.trim();
    if (!value) return;
    const key = el.dataset.key;
    if (!S.data.prefs[key].includes(value)) S.data.prefs[key].push(value);
    render();
    document.querySelector(`[data-act="pref-input"][data-key="${key}"]`)?.focus();
  }
  if (e.key === "Escape" && el.dataset.act === "summary-text") {
    if (S.summaryDirty && !confirm("放弃未保存的摘要修改？")) return;
    S.editingSummary = false; render();
  }
});

loadScenario(S.scenario);
</script>
</body>
</html>
